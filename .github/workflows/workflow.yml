name: Run checks

## Runs on pull requests and on pushes to main. Without the push trigger the
## matrix and the quality gate only ever saw proposed changes, so anything
## that landed and then broke -- a merge of two individually green branches,
## or a new Python release -- went unnoticed on main.
on:
  push:
    branches: [main]
  pull_request:

## One run per branch. Pushing again to a pull request used to leave the
## superseded run going to the end, holding a runner to report on a commit
## nobody is waiting for any more. Cancelling is right for a pull request and
## wrong for main, where every commit's result is a record of whether that
## commit was green, so the cancellation is conditioned on the event.
##
## `github.ref` is the pull request's merge ref on `pull_request` and the
## branch on `push`, so the two events never share a group and a merge does not
## cancel the run of the pull request it came from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

## Actions are pinned to commit SHAs, not tags. A tag is a mutable ref: both
## `@main` and `@v5` can be repointed at new code by whoever owns the action,
## which is the whole of the supply-chain exposure. The trailing comment names
## the release each SHA belongs to, so `git ls-remote --tags <repo>` is enough
## to check or bump one.

## None of these jobs write to the repository. Codecov authenticates with its
## own token, so read access to the contents is all any of them needs.
permissions:
  contents: read

## Every checkout below passes `persist-credentials: false`. By default the
## action leaves the job's token in .git/config as an extauthheader, where any
## later step -- a test, a linter, a build backend, anything they import -- can
## read it and use it against the repository. Nothing here needs git after the
## checkout, so nothing needs it left behind. `permissions` above caps what the
## token could do; this removes the opportunity to reach for it at all.

## Every job carries `timeout-minutes: 10`. The default is six hours, which is
## what a hung job would sit at, burning a runner and blocking nothing useful.
## The suite takes seconds, so ten minutes is already far more than the install
## and the tests together will ever want.

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group dev
      - name: Test
        run: python -m pytest src tests -vv

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group dev
      - name: Type check
        run: python -m ty check
      - name: Lint
        run: python -m ruff check
      - name: Format
        run: python -m ruff format --diff
      - name: Build
        run: python -m build .
      ## The build was being run and thrown away, which proved only that it did
      ## not crash. These three failures are all silent otherwise: a wheel that
      ## does not import, a py.typed that is declared in pyproject and not
      ## actually packaged -- the package advertises itself as typed, so that
      ## one degrades every downstream type check -- and a README that did not
      ## make it into the metadata, which PyPI would render as an empty page.
      ##
      ## Run from the runner's temp directory so `import colourings` can only
      ## resolve to the installed wheel and not to anything in the checkout.
      - name: Check the built wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --force-reinstall "$GITHUB_WORKSPACE"/dist/*.whl
          python - <<'PY'
          import pathlib
          from importlib.metadata import metadata

          import colourings

          print("version:", colourings.__version__)

          marker = pathlib.Path(colourings.__file__).parent / "py.typed"
          assert marker.exists(), "py.typed is declared in pyproject but not in the wheel"

          meta = metadata("colourings")
          content_type = meta["Description-Content-Type"]
          assert content_type == "text/markdown", f"long description is {content_type!r}"
          description = meta.get_payload() or meta["Description"] or ""
          assert len(description) > 1000, f"long description is {len(description)} characters"

          ## The metadata the source declares, as the build actually emitted it.
          ## The tests check pyproject.toml against the tree; only here is there
          ## a fresh build to check that setuptools understood it.
          licence = meta["License-Expression"]
          assert licence == "BSD-3-Clause", f"licence expression is {licence!r}"
          classifiers = meta.get_all("Classifier") or []
          assert "Typing :: Typed" in classifiers, classifiers
          assert not [c for c in classifiers if c.startswith("License ::")], (
              "PEP 639 forbids a License classifier beside the expression"
          )

          print("wheel imports, is typed, and carries the README and its licence")
          PY

  ## Read the Docs builds after merge, so a malformed docstring or a broken
  ## reference used to land and be discovered later, if at all. `-W` makes a
  ## warning fail the build, which is the only way a docs check is worth having:
  ## Sphinx reports almost everything that is wrong as a warning and exits 0.
  ## Sphinx 8 and later report every warning before failing; 7.4 stops at the
  ## first. `--keep-going` would force the former but is deprecated in 8 and a
  ## candidate for removal, so it is left off rather than pinned to rot.
  ##
  ## Deliberately not `-n`. Nitpicky mode also fails on references to things
  ## that are not documented, and the docstrings point at private helpers such
  ## as `_srgb_to_linear` on purpose, to explain the arithmetic to someone
  ## reading the source rather than the built page.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          ## Matching .readthedocs.yml, so this fails on what that would.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/requirements.txt
      - name: Install dependencies
        ## autodoc imports the package, so it has to be installed, not just
        ## present on disk.
        run: |
          python -m pip install --upgrade pip
          python -m pip install . -r docs/requirements.txt
      - name: Build the documentation
        run: python -m sphinx -W -b html docs docs/_build/html

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group dev
      - name: Generate coverage report
        run: python -m pytest --cov colourings --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@5975040f7f7d40edaff8d784b576fd65ae95c073 # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
          verbose: true
