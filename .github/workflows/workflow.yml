name: Run checks

## Runs on pull requests and on pushes to main. Without the push trigger the
## matrix and the quality gate only ever saw proposed changes, so anything
## that landed and then broke -- a merge of two individually green branches,
## or a new Python release -- went unnoticed on main.
on:
  push:
    branches: [main]
  pull_request:

## Actions are pinned to commit SHAs, not tags. A tag is a mutable ref: both
## `@main` and `@v5` can be repointed at new code by whoever owns the action,
## which is the whole of the supply-chain exposure. The trailing comment names
## the release each SHA belongs to, so `git ls-remote --tags <repo>` is enough
## to check or bump one.

## None of these jobs write to the repository. Codecov authenticates with its
## own token, so read access to the contents is all any of them needs.
permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group dev
      - name: Test
        run: python -m pytest src tests -vv

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group dev
      - name: Type check
        run: python -m ty check
      - name: Lint
        run: python -m ruff check
      - name: Format
        run: python -m ruff format --diff
      - name: Build
        run: python -m build .

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group dev
      - name: Generate coverage report
        run: python -m pytest --cov colourings --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@5975040f7f7d40edaff8d784b576fd65ae95c073  # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
          verbose: true
