name: Publish to PyPi

on:
  release:
    types: [created]

## For the build job. The publish job's own block replaces this rather than
## adding to it, so its id-token: write is unaffected.
permissions:
  contents: read

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    ## The build runs arbitrary build-backend code; the token has no reason to
    ## be in .git/config while it does.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
    - name: Install pypa/build and twine
      run: python3 -m pip install build twine
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    ## This is the last point at which a metadata mistake is still cheap. A
    ## version can be uploaded to PyPI once: a release whose long description
    ## does not render, or whose metadata the index refuses, cannot be fixed by
    ## re-uploading the same version. `--strict` makes a warning fatal, since
    ## the warnings are the ones that matter here -- a missing content type is
    ## a warning, and it silently defaults to reStructuredText.
    - name: Check the metadata the index will see
      run: python3 -m twine check --strict dist/*
    ## Nothing tied the release to the tree: the trigger publishes whatever
    ## pyproject.toml says, under whatever tag fired. Compared against the
    ## built wheel, since that is what gets uploaded.
    - name: Check the tag matches the version being published
      run: |
        count=$(ls dist/*.whl | wc -l)
        if [ "$count" -ne 1 ]; then
          echo "::error::Expected exactly one wheel in dist/, found $count."
          exit 1
        fi
        built=$(basename "$(ls dist/*.whl)" | cut -d- -f2)
        tag=${GITHUB_REF_NAME#v}
        if [ "$built" != "$tag" ]; then
          echo "::error::Release tag $GITHUB_REF_NAME asks for version '$tag', but the build produced '$built'. Bump the version in pyproject.toml, or retag."
          exit 1
        fi
        echo "Tag $GITHUB_REF_NAME matches the built version $built."
    - name: Store the distribution packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: python-package-distributions
        path: dist/
        ## Otherwise an empty upload succeeds and the publish job fails later,
        ## holding the credentials, with nothing to say about why.
        if-no-files-found: error

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs:
    - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/colourings
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
