name: Publish a release

on:
  release:
    types: [created]

## For the build job. The publish job's own block replaces this rather than
## adding to it, so its id-token: write is unaffected.
permissions:
  contents: read

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
    ## The build runs arbitrary build-backend code; the token has no reason to
    ## be in .git/config while it does.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install pypa/build, twine and packaging
      run: python3 -m pip install build twine packaging
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    ## This is the last point at which a metadata mistake is still cheap. A
    ## version can be uploaded to PyPI once: a release whose long description
    ## does not render, or whose metadata the index refuses, cannot be fixed by
    ## re-uploading the same version. `--strict` makes a warning fatal, since
    ## the warnings are the ones that matter here -- a missing content type is
    ## a warning, and it silently defaults to reStructuredText.
    - name: Check the metadata the index will see
      run: python3 -m twine check --strict dist/*
    - name: Check the tag matches the version, and choose the index
      id: version
      run: |
        python3 - <<'PY'
        import glob
        import os
        import pathlib

        from packaging.utils import InvalidWheelFilename, parse_wheel_filename
        from packaging.version import InvalidVersion, Version


        def fail(message):
            print(f"::error::{message}")
            raise SystemExit(1)


        wheels = sorted(glob.glob("dist/*.whl"))
        if len(wheels) != 1:
            fail(f"Expected exactly one wheel in dist/, found {len(wheels)}.")
        try:
            _, built, _, _ = parse_wheel_filename(pathlib.Path(wheels[0]).name)
        except InvalidWheelFilename as exc:
            fail(f"Cannot read a version from {wheels[0]}: {exc}")

        tag = os.environ["GITHUB_REF_NAME"]
        try:
            asked = Version(tag.removeprefix("v"))
        except InvalidVersion:
            fail(f"Release tag {tag!r} is not a PEP 440 version, so it names no release.")

        if asked != built:
            fail(
                f"Release tag {tag!r} asks for version {asked}, but the build produced "
                f"{built}. Bump the version in pyproject.toml, or retag."
            )

        index = "TestPyPI" if built.is_prerelease else "PyPI"
        print(f"Tag {tag} matches the built version {built}; publishing to {index}.")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
            handle.write(f"prerelease={'true' if built.is_prerelease else 'false'}\n")
        PY
    - name: Store the distribution packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: python-package-distributions
        path: dist/
        ## Otherwise an empty upload succeeds and the publish job fails later,
        ## holding the credentials, with nothing to say about why.
        if-no-files-found: error

  publish-to-testpypi:
    name: >-
      Publish Python 🐍 distribution 📦 to TestPyPI
    needs:
    - build
    if: needs.build.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/colourings
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs:
    - build
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/colourings
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
