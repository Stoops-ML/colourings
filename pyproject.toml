[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "colourings"
version = "1.0.0"
authors = [
    {name = "Daniel Stoops", email = "danielstoops25@gmail.com"},
]
description = "Colouring in Python"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["color", "colour"]
license = {file = "LICENSE.txt"}
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
]
dependencies = []

[dependency-groups]
dev = [
    "build>=1.4.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
    "ty>=0.0.75",
]

[project.urls]
Repository = "https://github.com/Stoops-ML/colourings"
Documentation = "https://colourings.readthedocs.io/en/latest/"

[tool.setuptools.package-data]
"colourings" = ["py.typed"]

[tool.ruff.lint]
ignore = ["E501"]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "C",
    "W",
    "B9"
]

[tool.ty.rules]
all = "error"
## `@override` requires typing_extensions on Python 3.10/3.11, and this package
## has no runtime dependencies.
missing-override-decorator = "ignore"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
