[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "colourings"
version = "1.0.0"
authors = [
    {name = "Daniel Stoops", email = "danielstoops25@gmail.com"},
]
description = "Colouring in Python"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["color", "colour"]
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = []

[dependency-groups]
dev = [
    "build>=1.4.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
    "ty>=0.0.75",
    "zizmor>=1.30.0",
]

[project.urls]
Repository = "https://github.com/Stoops-ML/colourings"
Documentation = "https://colourings.readthedocs.io/en/latest/"
Issues = "https://github.com/Stoops-ML/colourings/issues"
Changelog = "https://github.com/Stoops-ML/colourings/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"colourings" = ["py.typed"]

[tool.ruff.lint]
## PT011 wants a `match=` on every `pytest.raises` of a broad exception. Every
## error this package raises derives from ValueError or TypeError, so it fires
## 75 times. Worth doing -- a bare `raises(ValueError)` passes on a ValueError
## from a typo -- but as its own change, not buried in a ruleset bump.
ignore = ["E501", "PT011"]
select = [
    "A",
    "ARG",
    "B",
    "B9",
    "C",
    "E",
    "F",
    "I",
    "PERF",
    "PT",
    "RET",
    "RUF",
    "S",
    "SIM",
    "TID",
    "UP",
    "W",
]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["hex", "copyright"]

[tool.ruff.lint.per-file-ignores]
## flake8-bandit's S101 is `assert`, which is what a test is made of. The rest
## of S stays live in the tests: the three real hits there carry a noqa each,
## with the reason.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "--strict-markers --strict-config --doctest-modules"
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["colourings"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ty.rules]
all = "error"
## `@override` requires typing_extensions on Python 3.10/3.11, and this package
## has no runtime dependencies.
missing-override-decorator = "ignore"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
